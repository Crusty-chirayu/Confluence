<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Confluence — Private AI. Shared rooms.</title>
  <desc id="d">Three streams converging through a gateway into one AI core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#0e1424"/>
    </linearGradient>
    <linearGradient id="s1" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity="0"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="s2" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity="0"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="s3" x1="0" x2="1"><stop offset="0" stop-color="#34d399" stop-opacity="0"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M60 90 C 260 90, 320 200, 470 200" stroke="url(#s1)"/>
    <path d="M60 200 L 470 200" stroke="url(#s2)"/>
    <path d="M60 310 C 260 310, 320 200, 470 200" stroke="url(#s3)"/>
  </g>
  <circle cx="500" cy="200" r="120" fill="url(#glow)"/>
  <g transform="translate(500 200)">
    <path d="M-40 -46 L 0 0 L -40 46" fill="none" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-4 -30 L 30 0 L -4 30" fill="none" stroke="#a78bfa" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="0" r="7" fill="#34d399"/>
  </g>
  <text x="600" y="190" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#f1f5f9" letter-spacing="-2">Confluence</text>
  <text x="604" y="245" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#94a3b8">Private AI. Shared rooms.</text>
  <text x="604" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#64748b">you decide when the AI joins the conversation</text>
